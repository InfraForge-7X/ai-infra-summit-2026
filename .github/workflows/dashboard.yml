name: Dashboard CI

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build dashboard
        run: npm run build

      - name: Lint dashboard
        run: npm run lint
